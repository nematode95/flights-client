<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Supabase Runway, Flyovers & Live Status</title>
  <!-- Load the Supabase JavaScript client from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .card { background: #f9f9f9; border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 6px; }
    pre { background: #eee; padding: 10px; border-radius: 4px; overflow-x: auto; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Supabase Data Viewer</h1>

  <div class="card">
    <h2>Runway Observations</h2>
    <div id="runway-observations-output">Loading runway observations...</div>
  </div>

  <div class="card">
    <h2>Recent Flyovers</h2>
    <div id="flyovers-output">Loading flyovers...</div>
  </div>

  <div class="card">
    <h2>Live Status</h2>
    <div id="live-status-output">Loading live status...</div>
  </div>

  <script>
    function showError(element, message) {
      const paragraph = document.createElement("p");
      paragraph.className = "error";
      paragraph.textContent = `Error: ${message}`;
      element.replaceChildren(paragraph);
    }

    function showJson(element, label, updatedAt, value, count) {
      const fragment = document.createDocumentFragment();
      if (updatedAt !== undefined) {
        const updated = document.createElement("p");
        updated.textContent = `Last Updated: ${updatedAt ?? "Unavailable"}`;
        fragment.append(updated);
      }

      if (count !== undefined) {
        const countElement = document.createElement("p");
        countElement.textContent = `Aircraft Count: ${count}`;
        fragment.append(countElement);
      }

      const output = document.createElement("pre");
      output.setAttribute("aria-label", label);
      output.textContent = JSON.stringify(value, null, 2);
      fragment.append(output);
      element.replaceChildren(fragment);
    }

    async function fetchData() {
      const runwayObservationsDiv = document.getElementById("runway-observations-output");
      const flyoversDiv = document.getElementById("flyovers-output");
      const liveStatusDiv = document.getElementById("live-status-output");

      try {
        const configResponse = await fetch("/api/config", { cache: "no-store" });
        const config = await configResponse.json();
        if (!configResponse.ok) {
          throw new Error(config.error || `Configuration request failed (${configResponse.status})`);
        }

        const supabaseClient = supabase.createClient(config.url, config.anonKey);
        const [runwayObservationsResult, flyoversResult, snapshotResult] = await Promise.all([
          supabaseClient
            .from("runway_observations")
            .select("*"),
          supabaseClient
            .from("recent_flyovers")
            .select("flyovers, updated_at")
            .eq("id", "current")
            .single(),
          supabaseClient
            .from("live_snapshot")
            .select("payload, updated_at")
            .eq("id", "current")
            .single()
        ]);

        if (runwayObservationsResult.error) {
          showError(runwayObservationsDiv, runwayObservationsResult.error.message);
        } else {
          showJson(
            runwayObservationsDiv,
            "Runway observations",
            undefined,
            runwayObservationsResult.data
          );
        }

        if (snapshotResult.error) {
          showError(liveStatusDiv, snapshotResult.error.message);
        } else {
          showJson(
            liveStatusDiv,
            "Aircraft data",
            snapshotResult.data.updated_at,
            snapshotResult.data.payload?.aircraft ?? null,
            snapshotResult.data.payload?.count ?? "Unavailable"
          );
        }

        if (flyoversResult.error) {
          showError(flyoversDiv, flyoversResult.error.message);
        } else {
          showJson(
            flyoversDiv,
            "Recent flyovers",
            flyoversResult.data.updated_at,
            flyoversResult.data.flyovers
          );
        }
      } catch (error) {
        const message = error instanceof Error ? error.message : "Unexpected error";
        showError(runwayObservationsDiv, message);
        showError(flyoversDiv, message);
        showError(liveStatusDiv, message);
      }
    }

    fetchData();
  </script>
</body>
</html>
